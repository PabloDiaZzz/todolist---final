# Configuración de Base de Datos en Producción (PostgreSQL para Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}?sslmode=require
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Mail
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=ToDo List Support <todolistgjv64177@gmail.com>

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.port=2525
