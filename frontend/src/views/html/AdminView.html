<div id="theme-wrapper"
    class="flex flex-col items-center bg-gray-200 dark:bg-slate-900 m-0 w-full min-h-screen overflow-x-hidden font-sans antialiased">
    <a href="#admin-main" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-white focus:dark:bg-slate-800 focus:p-3 focus:rounded-xl focus:shadow-xl focus:text-indigo-600 focus:dark:text-indigo-400 focus:font-bold skip-link">Saltar al contenido principal</a>
    <app-header class="block w-full" current-view="admin"></app-header>

    <main id="admin-main"
        class="w-full max-w-6xl mx-auto px-4 xl:px-0 grid grid-cols-1 md:grid-cols-3 gap-6 mt-8 pb-10 md:pt-20 text-black dark:text-white items-start">

        <section id="users-section" class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm flex flex-col max-h-[calc(100svh-7.5rem)]">
            <h2 class="text-xl font-bold border-b border-gray-200 dark:border-slate-700 pb-2 mb-4">
                Gestión de Usuarios
            </h2>

            <div id="buscar-user-container" data-active="false"
                class="shrink-0 group/search-user relative flex items-center bg-blue-600 dark:bg-indigo-600 hover:bg-blue-700 dark:hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition-all duration-750 mb-3 h-10 w-24 data-[active=true]:w-full cursor-pointer overflow-hidden data-[active=true]:bg-gray-300 dark:data-[active=true]:bg-slate-900">
                <div
                    class="absolute inset-0 flex items-center justify-center transition-all duration-750 opacity-100 group-data-[active=true]/search-user:opacity-0 pointer-events-none group-data-[active=true]/search-user:scale-y-0 group-data-[active=true]/search-user:scale-x-10">
                    Buscar
                    <svg class="size-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="buscar-user-input" placeholder="Escribe para buscar..."
                    class="absolute inset-0 w-full h-full bg-transparent border-none outline-none px-4 text-slate-800 dark:text-white transition-all duration-750 delay-0 opacity-0 scale-90 group-data-[active=true]/search-user:opacity-100 group-data-[active=true]/search-user:scale-100 group-data-[active=true]/search-user:delay-200 pointer-events-none group-data-[active=true]/search-user:pointer-events-auto placeholder:font-medium placeholder:text-slate-500 dark:placeholder:text-slate-400">
            </div>

            <ul
                class="users-list flex flex-col gap-3 flex-1 overflow-y-auto pr-2 min-h-0 scrollbar-thin scrollbar-thumb-gray-300 dark:scrollbar-thumb-slate-600 scrollbar-track-transparent scrollbar-thumb-rounded-full">
            </ul>

            <div id="no-users"
                class="flex flex-col items-center justify-center py-4 text-gray-500 dark:text-gray-400 text-center gap-3">
                <svg class="size-12 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor"
                    stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                </svg>
                <p class="font-medium text-sm">Parece que solo estás tú por aquí.</p>
            </div>
        </section>


        <section id="categories-section" class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm flex flex-col max-h-[calc(100svh-9.5rem)]">
            <h2 class="text-xl font-bold border-b border-gray-200 dark:border-slate-700 pb-2 mb-4">Gestión de Categorías
            </h2>

            <form id="create-cat-form" class="flex gap-2 mb-4 shrink-0">
                <input type="text" name="title" placeholder="Nueva categoría..." required aria-label="Nueva categoría"
                    class="w-full border border-gray-300 dark:border-slate-600 rounded-lg px-3 py-2 bg-gray-50 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit"
                    class="bg-brand text-white px-3 py-2 rounded-lg text-sm font-bold transition-all">Crear</button>
            </form>

            <div id="buscar-cat-container" data-active="false"
                class="shrink-0 group/search relative flex items-center bg-blue-600 dark:bg-indigo-600 hover:bg-blue-700 dark:hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition-all duration-750 mb-3 h-10 w-24 data-[active=true]:w-full cursor-pointer overflow-hidden data-[active=true]:bg-gray-300 dark:data-[active=true]:bg-slate-900">
                <div
                    class="absolute inset-0 flex items-center justify-center transition-all duration-750 opacity-100 group-data-[active=true]/search:opacity-0 pointer-events-none group-data-[active=true]/search:scale-y-0 group-data-[active=true]/search:scale-x-10">
                    Buscar
                    <svg class="size-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="buscar-cat-input" placeholder="Escribe para buscar..."
                    class="absolute inset-0 w-full h-full bg-transparent border-none outline-none px-4 text-slate-800 dark:text-white transition-all duration-750 delay-0 opacity-0 scale-90 group-data-[active=true]/search:opacity-100 group-data-[active=true]/search:scale-100 group-data-[active=true]/search:delay-200 pointer-events-none group-data-[active=true]/search:pointer-events-auto placeholder:font-medium placeholder:text-slate-500 dark:placeholder:text-slate-400">
            </div>

            <ul
                class="cats-list flex flex-col gap-2 flex-1 overflow-y-auto pr-2 min-h-0 scrollbar-thin scrollbar-thumb-gray-300 dark:scrollbar-thumb-slate-600 scrollbar-track-transparent scrollbar-thumb-rounded-full">
            </ul>

            <div id="no-cats"
                class="hidden flex-col items-center justify-center py-4 text-gray-500 dark:text-gray-400 text-center gap-3">
                <svg class="size-12 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor"
                    stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.75 6A2.25 2.25 0 001.5 8.25v10.5A2.25 2.25 0 003.75 21h16.5A2.25 2.25 0 0022.5 18.75V8.25A2.25 2.25 0 0020.25 6H3.75zm0 0a2.25 2.25 0 012.25-2.25h12.75A2.25 2.25 0 0120.25 6m-15.379-2.018L5.25 6.75m0 0l3.382-4.518" />
                </svg>
                <p class="font-medium text-sm">Parece que no hay categorías.</p>
            </div>
        </section>


        <section id="tasks-section" class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm flex flex-col max-h-[calc(100svh-7.5rem)]">
            <h2 class="text-xl font-bold border-b border-gray-200 dark:border-slate-700 pb-2 mb-4">Todas las Tareas</h2>

            <div id="buscar-task-container" data-active="false"
                class="shrink-0 group/search-task relative flex items-center bg-blue-600 dark:bg-indigo-600 hover:bg-blue-700 dark:hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition-all duration-750 mb-3 h-10 w-24 data-[active=true]:w-full cursor-pointer overflow-hidden data-[active=true]:bg-gray-300 dark:data-[active=true]:bg-slate-900">
                <div
                    class="absolute inset-0 flex items-center justify-center transition-all duration-750 opacity-100 group-data-[active=true]/search-task:opacity-0 pointer-events-none group-data-[active=true]/search-task:scale-y-0 group-data-[active=true]/search-task:scale-x-10">
                    Buscar
                    <svg class="size-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text" id="buscar-task-input" placeholder="Escribe para buscar..."
                    class="absolute inset-0 w-full h-full bg-transparent border-none outline-none px-4 text-slate-800 dark:text-white transition-all duration-750 delay-0 opacity-0 scale-90 group-data-[active=true]/search-task:opacity-100 group-data-[active=true]/search-task:scale-100 group-data-[active=true]/search-task:delay-200 pointer-events-none group-data-[active=true]/search-task:pointer-events-auto placeholder:font-medium placeholder:text-slate-500 dark:placeholder:text-slate-400">
            </div>

            <ul class="tasks-list flex flex-col gap-3 flex-1 overflow-y-auto pr-2 min-h-0 scrollbar-thin scrollbar-thumb-gray-300 dark:scrollbar-thumb-slate-600 scrollbar-track-transparent scrollbar-thumb-rounded-full">
            </ul>

            <div id="no-tasks"
                class="hidden flex-col items-center justify-center py-6 text-gray-500 dark:text-gray-400 text-center gap-3">
                <svg class="size-12 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor"
                    stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
                <p class="font-medium text-sm">No hay otras tareas asignadas.</p>
            </div>
        </section>

    </main>

    <dialog id="task-info"
        class="bg-white dark:bg-slate-800 shadow-xl m-auto p-6 border-none rounded-2xl outline-none w-[90%] max-w-md">
        <div id="task-info-content" class="flex flex-col items-stretch gap-4">
            <div class="flex justify-between items-center">
                <h2 id="task-info-title"
                    class="self-center font-bold text-blue-500 dark:text-indigo-500 text-xl text-center whitespace-break-spaces">
                </h2>
                <svg
                    class="self-center bg-blue-200 dark:bg-indigo-900 fill-blue-500 dark:fill-indigo-500 -my-2 p-2 rounded-full size-12">
                    <use href="/main.svg#info"></use>
                </svg>

            </div>
            <pre id="task-info-desc"
                class="bg-gray-100 dark:bg-slate-900 p-2 border border-gray-300 dark:border-slate-600 rounded-xl font-sans dark:text-white whitespace-pre-wrap w-full max-w-full break-words overflow-x-auto"></pre>
            <div class="info-field-['Fecha_limite:']">
                <p id="task-info-deadline"
                    class="bg-gray-100 dark:bg-slate-900 p-2 border border-gray-300 dark:border-slate-600 rounded-xl dark:text-white">
                </p>
            </div>
            <div class="flex flex-col justify-between gap-3">
                <div id="task-info-categories" class="flex flex-wrap gap-2 mt-2"></div>
                <div id="task-info-tags" class="flex flex-wrap gap-2 mt-2"></div>
            </div>
            <status-info id="task-info-status" type="pendiente"></status-info>
            <div class="info-field-['Fecha_de_creación:']">
                <p id="task-info-created-at"
                    class="bg-gray-100 dark:bg-slate-900 p-2 border border-gray-300 dark:border-slate-600 rounded-xl dark:text-white">
                </p>
            </div>
            <div
                class="bg-gray-100 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl dark:text-white info-field-['Última_modificación:']">
                <p id="task-info-updated-at" class="p-2"></p>
            </div>
            <button id="close-task-info"
                class="self-stretch bg-red-500 p-2 rounded-xl outline-none text-white hover:scale-101 transition-all cursor-pointer item-stretch">Cerrar</button>
        </div>
    </dialog>
</div>
