<div id="theme-wrapper"
    class="flex flex-col items-center bg-gray-200 dark:bg-slate-900 m-0 w-full min-h-screen overflow-x-hidden font-sans antialiased">
    <app-header class="block w-full" current-view="userinfo"></app-header>

    <main class="flex flex-col gap-5 mx-auto mt-8 px-4 md:pt-20 pb-10 w-full max-w-2xl">
        <section class="bg-back-secondary rounded-2xl shadow-sm overflow-hidden w-full">

            <div class="bg-blue-500 dark:bg-indigo-700 px-6 py-5 flex items-center justify-between gap-4">
                <div class="min-w-0">
                    <p
                        class="text-blue-100 dark:text-indigo-300 text-xs font-semibold uppercase tracking-widest mb-0.5">
                        Perfil de usuario</p>
                    <h2 id="user-info-title" class="text-white font-bold text-xl truncate"></h2>
                    <p id="user-info-username-sub"
                        class="text-blue-100/80 dark:text-indigo-200/70 text-sm font-medium mt-0.5"></p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <span id="user-info-role"
                        class="px-3 py-1.5 rounded-full text-xs font-bold tracking-wide border border-white/30 bg-white/15 text-white">
                    </span>
                    <button id="edit-profile-btn" type="button"
                        class="size-9 flex items-center justify-center rounded-full bg-white/15 hover:bg-white/25 border border-white/30 text-white transition-colors cursor-pointer"
                        title="Editar perfil">
                        <svg id="edit-icon" class="size-4" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125" />
                        </svg>
                        <svg id="save-icon" class="size-4 hidden" fill="none" stroke="currentColor" stroke-width="2.5"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="px-6 py-5 grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div
                    class="flex flex-col gap-1.5 p-3 rounded-xl bg-gray-50 dark:bg-slate-900/50 border border-gray-100 dark:border-slate-700">
                    <p class="text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Nombre
                        completo</p>
                    <p id="user-info-fullname" class="text-sm font-semibold text-gray-800 dark:text-gray-100 truncate">
                    </p>
                    <input id="edit-fullname" type="text" autocomplete="off"
                        class="hidden input-underline text-sm font-semibold text-gray-800 dark:text-gray-100 ring-0 outline-none w-full bg-transparent">
                </div>

                <div
                    class="flex flex-col gap-1.5 p-3 rounded-xl bg-gray-50 dark:bg-slate-900/50 border border-gray-100 dark:border-slate-700">
                    <p class="text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Usuario
                    </p>
                    <p id="user-info-username" class="text-sm font-semibold text-gray-800 dark:text-gray-100"></p>
                    <input id="edit-username" type="text" autocomplete="off"
                        class="hidden input-underline text-sm font-semibold text-gray-800 dark:text-gray-100 ring-0 outline-none w-full bg-transparent">
                    <p id="username-feedback" class="hidden text-xs font-medium"></p>
                </div>

                <div
                    class="flex flex-col gap-1.5 p-3 rounded-xl bg-gray-50 dark:bg-slate-900/50 border border-gray-100 dark:border-slate-700 sm:col-span-2">
                    <p class="text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Correo
                        electrónico</p>
                    <p id="user-info-email" class="text-sm font-semibold text-gray-800 dark:text-gray-100 truncate"></p>
                    <input id="edit-email" type="email" autocomplete="off"
                        class="hidden input-underline text-sm font-semibold text-gray-800 dark:text-gray-100 ring-0 outline-none w-full bg-transparent">
                    <p id="email-feedback" class="hidden text-xs font-medium"></p>
                </div>

                <div
                    class="flex flex-col gap-1.5 p-3 rounded-xl bg-gray-50 dark:bg-slate-900/50 border border-gray-100 dark:border-slate-700 sm:col-span-2">
                    <p class="text-xs text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Tareas
                        asignadas</p>
                    <p id="user-info-task-count" class="text-sm font-semibold text-gray-800 dark:text-gray-100"></p>
                </div>

            </div>
        </section>


        <section class="flex flex-col bg-back-secondary p-6 rounded-2xl shadow-sm w-full gap-3">
            <h2
                class="font-bold text-gray-900 dark:text-white text-lg border-b border-gray-100 dark:border-slate-700 pb-3">
                Tareas</h2>
            <ul id="task-list" class="flex flex-col gap-2">
            </ul>
        </section>



    </main>

    <dialog id="task-info"
        class="bg-white dark:bg-slate-800 shadow-xl m-auto p-6 border-none rounded-2xl outline-none min-w-md">
        <div id="task-info-content" class="flex flex-col items-stretch gap-4">
            <div class="flex justify-between items-center">
                <h2 id="task-info-title"
                    class="self-center font-bold text-blue-500 dark:text-indigo-500 text-xl text-center whitespace-break-spaces">
                </h2>
                <svg
                    class="self-center bg-blue-200 dark:bg-indigo-900 fill-blue-500 dark:fill-indigo-500 -my-2 p-2 rounded-full size-12">
                    <use href="/main.svg#info"></use>
                </svg>

            </div>
            <pre id="task-info-desc"
                class="bg-gray-100 dark:bg-slate-900 p-2 border border-gray-300 dark:border-slate-600 rounded-xl max-w-125 font-sans dark:text-white whitespace-pre-wrap"></pre>
            <div class="info-field-['Fecha_limite:']">
                <p id="task-info-deadline"
                    class="bg-gray-100 dark:bg-slate-900 p-2 border border-gray-300 dark:border-slate-600 rounded-xl dark:text-white">
                </p>
            </div>
            <div class="flex flex-col justify-between gap-3">
                <div id="task-info-categories"></div>
                <div id="task-info-tags"></div>
            </div>
            <status-info id="task-info-status" type="pendiente"></status-info>
            <div class="info-field-['Fecha_de_creación:']">
                <p id="task-info-created-at"
                    class="bg-gray-100 dark:bg-slate-900 p-2 border border-gray-300 dark:border-slate-600 rounded-xl dark:text-white">
                </p>
            </div>
            <div
                class="bg-gray-100 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-xl dark:text-white info-field-['Última_modificación:']">
                <p id="task-info-updated-at" class="p-2"></p>
            </div>
            <button id="close-task-info"
                class="self-stretch bg-red-500 p-2 rounded-xl outline-none text-white hover:scale-101 transition-all cursor-pointer item-stretch">Cerrar</button>
        </div>
    </dialog>
</div>
